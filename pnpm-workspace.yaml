packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
autoInstallPeers: false
strictPeerDependencies: true
saveExact: true
engineStrict: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
